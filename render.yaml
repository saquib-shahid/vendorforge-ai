services:
  - type: web
    name: vendorforge-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMMA_MODEL
        value: gemma-2-9b-it
      - key: GEMMA_PROVIDER
        value: auto
